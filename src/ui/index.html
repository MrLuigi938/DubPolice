<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dub Police · Der Fall der verschwundenen Stimmen</title>
<link rel="stylesheet" href="fallakte.css">
</head>
<body>
<img class="space" src="hintergrund.jpg" alt="" aria-hidden="true">

<main class="dossier">
  <div class="tabbar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="lang-tabs" role="radiogroup" id="language">
      <button type="button" class="lang-tab" role="radio" data-language="german">Deutsch</button>
      <button type="button" class="lang-tab" role="radio" data-language="french">Français</button>
    </div>
  </div>

  <section class="paper" role="tabpanel" id="panel">
    <div class="left">
      <h1 id="title"></h1>
      <div class="photo"><img id="photo" src="hintergrund.jpg" alt=""></div>
      <p class="evidence" id="evidence" aria-live="polite"></p>
    </div>

    <div class="right">
      <header class="case">
        <span id="caseName"></span>
        <span id="caseNo"></span>
      </header>
      <div class="stamp" id="stamp" aria-hidden="true"></div>

      <div id="openView" class="view">
        <button type="button" class="path" id="gameRow">
          <span class="caption" id="gameCaption"></span>
          <span class="value" id="gameValue"></span>
        </button>
        <button type="button" class="path" id="sourceRow">
          <span class="caption" id="sourceCaption"></span>
          <span class="value" id="sourceValue"></span>
        </button>
        <fieldset class="episodes" id="episodes">
          <legend id="episodesLegend"></legend>
          <div id="episodeList"></div>
        </fieldset>

        <label class="episode deess" id="deessRow">
          <input type="checkbox" id="deess">
          <span id="deessText"></span>
        </label>

        <div class="actions" id="actions">
          <button type="button" class="install" id="install"></button>
          <button type="button" class="linkish" id="remove"><span id="removeText"></span><small id="removeHint"></small></button>
        </div>

        <div class="running" id="running" hidden>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div id="barFill"></div></div>
          <div class="runline">
            <span id="runText"></span>
            <button type="button" class="linkish" id="cancel"></button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="fallakte.js"></script>
</body>
</html>
